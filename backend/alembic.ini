# CyberSathi migrations.
#
# The database URL is deliberately NOT set here -- alembic/env.py reads it from
# app.config.settings, which honours the DATABASE_URL environment variable and
# backend/.env. That keeps one single source of truth for the connection string.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# Timestamped filenames so revisions sort in the order they were written.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
# render_as_batch is set in env.py: SQLite cannot ALTER a column in place, so
# migrations are rendered as table rebuilds.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
